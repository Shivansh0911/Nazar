    license: Pexels License
  - out: samples/clip5.mp4
    camera: night-market
    scene: "Fruit stall at night under tube lights, customers in front of the counter; fixed eye-level camera, low light"
    source: pexels
    pexels_id: 32166140
    slug: bustling-night-fruit-market-with-vibrant-colors
    page: https://www.pexels.com/video/bustling-night-fruit-market-with-vibrant-colors-32166140/
    author: Riaz Uddin
    license: Pexels License
  - out: samples/clip6_bag.mp4
    camera: office-desk
    scene: "Office/classroom desks from a corner CCTV (ABODA video10): a person puts a bag on a desk and leaves; the second half is the same footage time-reversed, so the person comes back and takes the bag (constructed pickup for the object_removed demo). 720x480"
    source: url
    url: https://raw.githubusercontent.com/kevinlin311tw/ABODA/master/video10.avi
    page: https://github.com/kevinlin311tw/ABODA
    author: ABODA (ABandoned Objects DAtaset), Kevin Lin et al.
    license: "Public research dataset (no explicit licence in the repository); used for a non-commercial research demo with credit"
    pickup_reverse_from: 30

