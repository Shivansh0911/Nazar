# Demo footage sources. Re-download + normalize with:  python scripts/fetch_samples.py
# Pexels clips are under the Pexels License (free to use, no attribution required; we credit anyway).
# ABODA: public abandoned-object research dataset (GitHub kevinlin311tw/ABODA).
# CAVIAR clips: EC Funded CAVIAR project/IST 2001 37540 - free for research use with acknowledgement.
clips:
  - out: samples/clip1.mp4
