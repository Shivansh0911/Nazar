[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nazar"
version = "0.1.0"
description = "Nazar - ask your CCTV anything, in your own language"
requires-python = ">=3.12"
dependencies = [
  "ultralytics>=8.3.0", "lap>=0.5.12", "opencv-python>=4.10,<5", "numpy>=1.26,<2.3",
  "psycopg[binary]>=3.2", "psycopg-pool>=3.2", "pgvector>=0.3.6",
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.12",
  "openai>=1.60", "pydantic>=2.9", "pydantic-settings>=2.6", "python-dotenv>=1.0",
  "boto3>=1.35", "pyyaml>=6.0", "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["nazar*"]

[tool.setuptools.package-data]
nazar = ["sql/*.sql", "edge/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: real OpenAI calls (run when OPENAI_API_KEY is set)", "db: needs the dev Postgres"]
