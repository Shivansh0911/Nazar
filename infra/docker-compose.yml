name: nazar
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nazar
      POSTGRES_PASSWORD: nazar
      POSTGRES_DB: nazar
    ports: ["${NAZAR_PG_PORT:-5433}:5432"]  # 5433 on the host: 5432 is often taken by another local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 1g
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nazar -d nazar"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  mediamtx:
    image: bluenviron/mediamtx:1
    ports:
      - "8554:8554/tcp"
      - "1935:1935/tcp"
      - "8890:8890/udp"
      - "8889:8889/tcp"   # WebRTC (WHEP) for the blurred *_view streams
      - "8189:8189/udp"   # WebRTC ICE
    environment:
      MTX_PATHDEFAULTS_RECORD: ${RECORD_RAW_BOOL:-no}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ../data/recordings:/recordings
    mem_limit: 256m
    restart: unless-stopped
volumes:
  pgdata:
